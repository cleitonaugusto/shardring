[package]
name = "shardring-bench"
publish = false
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bench]]
name = "shardring-bench"
path = "src/main.rs"
harness = false

[dependencies]
shardring = { path = "../shardring", features = ["std", "migration", "adaptive-ring", "serde"] }
criterion = "0.5"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
