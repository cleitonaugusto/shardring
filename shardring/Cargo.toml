[package]
name = "shardring"
description = "Consistent hashing with bounded loads, live migration between ring configurations and a compact in-memory layout"
readme = "README.md"
categories = ["data-structures", "algorithms", "network-programming"]
keywords = ["consistent-hashing", "ketama", "load-balancing", "sharding", "maglev"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1.15", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
md-5 = "0.10"
tokio = { version = "1.0", features = ["rt", "sync", "time", "macros"], optional = true }
postcard = { version = "1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["std", "adaptive-ring"]
std = []
adaptive-ring = []
migration = ["std"]
serde = ["dep:serde_json"]
health = ["std", "dep:tokio"]
serialization = ["dep:postcard"]

[dev-dependencies]
proptest = "1.0"

[package.metadata.docs.rs]
all-features = true
