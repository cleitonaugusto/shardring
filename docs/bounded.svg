<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Without a cap, one node absorbs a burst. With a per-node cap of 1.25 times the mean, the overflow goes to the next node on the ring.">
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t  { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    .tb { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .tm { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
    .warn { font: 600 12px system-ui, sans-serif; fill: #dc2626; }
    .ok { font: 600 12px system-ui, sans-serif; fill: #059669; }
  </style>

  <!-- left: plain consistent hashing -->
  <text x="20" y="28" class="tb">Plain consistent hashing</text>
  <text x="20" y="48" class="t">no back pressure — one node absorbs the burst</text>

  <line x1="20" y1="230" x2="330" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="20" y1="150" x2="330" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="336" y="154" class="tm">mean</text>

  <rect x="40"  y="80"  width="56" height="150" rx="3" fill="#dc2626" opacity="0.85"/>
  <rect x="130" y="176" width="56" height="54"  rx="3" fill="#2563eb" opacity="0.7"/>
  <rect x="220" y="166" width="56" height="64"  rx="3" fill="#2563eb" opacity="0.7"/>

  <text x="68"  y="250" class="tm" text-anchor="middle">node-a</text>
  <text x="158" y="250" class="tm" text-anchor="middle">node-b</text>
  <text x="248" y="250" class="tm" text-anchor="middle">node-c</text>
  <text x="68"  y="72"  class="warn" text-anchor="middle">hot</text>
  <text x="20"  y="278" class="t">tail latency follows the tallest bar</text>

  <!-- right: bounded load -->
  <text x="430" y="28" class="tb">With bounded loads</text>
  <text x="430" y="48" class="t">cap of 1.25 × mean, overflow walks the ring</text>

  <line x1="430" y1="230" x2="740" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="430" y1="150" x2="740" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="430" y1="130" x2="740" y2="130" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="746" y="134" class="tm">cap</text>

  <rect x="450" y="130" width="56" height="100" rx="3" fill="#059669" opacity="0.8"/>
  <rect x="540" y="146" width="56" height="84"  rx="3" fill="#2563eb" opacity="0.7"/>
  <rect x="630" y="140" width="56" height="90"  rx="3" fill="#2563eb" opacity="0.7"/>

  <text x="478" y="250" class="tm" text-anchor="middle">node-a</text>
  <text x="568" y="250" class="tm" text-anchor="middle">node-b</text>
  <text x="658" y="250" class="tm" text-anchor="middle">node-c</text>
  <text x="478" y="122" class="ok" text-anchor="middle">capped</text>

  <path d="M 508 100 C 540 84, 560 84, 566 138" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowSlate)"/>
  <text x="556" y="92" class="tm">overflow</text>
  <text x="430" y="278" class="t">still only ~1/N of keys move when the node set changes</text>
</svg>
